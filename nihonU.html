<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Image</title>
    <link rel="stylesheet" href="nihon.css">
</head>
<body>
    <header>
        <h1>Upload Image</h1>
        <nav>
            <a href="nihonG.html">Go to Nihon Gallery</a>
        </nav>
    </header>

    <main>
        <form id="uploadForm">
            <label for="image">Select Image:</label>
            <input type="file" id="image" accept="image/*" required><br><br>

            <label for="description">Image Description:</label>
            <input type="text" id="description" placeholder="Image description" required><br><br>

            <button type="submit">Upload Image</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2025 Wonders of Japan. All rights reserved.</p>
    </footer>

    <script src="nihonU.js"></script>
</body>
</html>
